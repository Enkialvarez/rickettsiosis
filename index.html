<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roco y la Garrapata Traviesa — Simulador Educativo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Comic Sans MS', 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: linear-gradient(180deg, #aee9ff 0%, #e8f9ff 55%, #fff6d9 100%);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    color: #2c3e50; padding: 12px; user-select: none; overflow-x: hidden;
  }
  header { text-align: center; margin: 8px 0 4px; }
  h1 { font-size: clamp(22px, 4.5vw, 38px); color: #e67e22; text-shadow: 2px 2px 0 #fff; }
  .sub { font-size: clamp(13px, 2.5vw, 18px); color: #2980b9; font-weight: bold; }
  #hud { display: flex; gap: 16px; font-size: clamp(18px, 3vw, 26px); margin: 8px 0; font-weight: bold; align-items: center; }
  #level-badge { background: #8e44ad; color: #fff; border-radius: 14px; padding: 3px 14px; font-size: clamp(13px,2vw,16px); }
  #screen {
    background: #ffffff; border: 6px solid #f39c12; border-radius: 28px;
    box-shadow: 0 10px 24px rgba(0,0,0,.18); width: 100%; max-width: 880px;
    min-height: 470px; padding: 22px; text-align: center; position: relative; overflow: hidden;
  }
  .scene-title { font-size: clamp(20px, 3.6vw, 30px); color: #d35400; margin-bottom: 8px; }
  .story { font-size: clamp(16px, 2.8vw, 22px); line-height: 1.55; margin: 10px auto 18px; max-width: 720px; }
  .big-btn {
    font-family: inherit; font-size: clamp(16px, 2.7vw, 22px); font-weight: bold; color: #fff;
    background: linear-gradient(180deg, #3498db, #2471a3); border: none; border-radius: 18px;
    padding: 14px 28px; margin: 8px; cursor: pointer; box-shadow: 0 5px 0 #1a5276;
    transition: transform .08s; min-width: 220px;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #1a5276; }
  .big-btn.green { background: linear-gradient(180deg, #2ecc71, #239b56); box-shadow: 0 5px 0 #196f3d; }
  .big-btn.orange { background: linear-gradient(180deg, #eb984e, #ca6f1e); box-shadow: 0 5px 0 #935116; }
  .big-btn.red { background: linear-gradient(180deg, #ec7063, #cb4335); box-shadow: 0 5px 0 #943126; }
  .big-btn.gray { background: linear-gradient(180deg, #95a5a6, #707b7c); box-shadow: 0 5px 0 #4d5656; }
  .option-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .msg { font-size: clamp(17px, 3vw, 24px); font-weight: bold; min-height: 36px; margin-top: 10px; }
  .msg.ok { color: #239b56; } .msg.no { color: #cb4335; }
  .fact-box { background: #fef9e7; border: 3px dashed #f1c40f; border-radius: 16px; padding: 14px 18px;
    font-size: clamp(15px, 2.6vw, 20px); margin: 12px auto; max-width: 700px; line-height: 1.5; }
  .stars-end { font-size: clamp(40px, 8vw, 64px); letter-spacing: 8px; margin: 10px; }
  .kid { font-size: 90px; }
  .progress { font-size: 14px; color: #7f8c8d; margin-top: 14px; }
  footer { margin-top: 12px; font-size: 12px; color: #7f8c8d; text-align: center; max-width: 720px; }
  .pop { animation: pop .4s ease; display: inline-block; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.3)} 100%{transform:scale(1)} }
  .wiggle { animation: wiggle 1.6s ease-in-out infinite; display: inline-block; }
  @keyframes wiggle { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
  .float-up { animation: floatUp 1.2s ease-out forwards; position: absolute; font-weight: bold; pointer-events: none; z-index: 5; }
  @keyframes floatUp { 0%{opacity:1; transform:translateY(0)} 100%{opacity:0; transform:translateY(-70px)} }
  .confetti { position: absolute; top: -20px; font-size: 24px; animation: fall linear forwards; pointer-events: none; z-index: 6; }
  @keyframes fall { to { transform: translateY(560px) rotate(360deg); opacity: 0; } }

  /* --- Escenario del patio --- */
  #yard {
    position: relative; width: 100%; max-width: 700px; height: 340px; margin: 10px auto;
    border-radius: 20px; overflow: hidden; border: 4px solid #7dcea0;
    background:
      radial-gradient(circle at 85% 12%, #fff3b0 0%, transparent 26%),
      linear-gradient(180deg, #aee6ff 0%, #d6f5d6 42%, #a9dfbf 100%);
  }
  .sun { position: absolute; top: 10px; right: 14px; font-size: 52px; }
  .bush { position: absolute; bottom: 26px; font-size: 64px; }
  .dog {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: 140px; transition: transform .3s; z-index: 2;
  }
  .dog.happy-hop { animation: hop .5s ease; }
  @keyframes hop { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-22px)} }
  .dog.shake { animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(-50%)} 25%{transform:translateX(calc(-50% - 8px))} 75%{transform:translateX(calc(-50% + 8px))} }
  .mood { font-size: 40px; position: absolute; top: 6px; left: 10px; z-index: 3; }
  .tick-img {
    position: absolute; width: 44px; cursor: pointer; z-index: 4;
    filter: drop-shadow(1px 2px 2px rgba(0,0,0,.35)); transition: transform .15s;
  }
  .tick-img:hover { transform: scale(1.4) rotate(12deg); }
  .tick-img.flee { animation: flee .5s forwards; }
  @keyframes flee { to { transform: translateY(60px) scale(.4); opacity: 0; } }
  .timer-bar { width: 100%; max-width: 700px; height: 16px; background: #ecf0f1; border-radius: 10px; margin: 6px auto; overflow: hidden; border: 2px solid #bdc3c7; }
  .timer-fill { height: 100%; background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c); width: 100%; transition: width .3s linear; }

  /* --- Tarjetas de memoria (quiz) --- */
  .quiz-card { background: linear-gradient(180deg, #eaf2f8, #d4e6f1); border: 4px solid #5dade2; border-radius: 20px;
    padding: 18px; max-width: 680px; margin: 0 auto 14px; }
  .quiz-img { width: clamp(90px, 18vw, 150px); border-radius: 14px; border: 3px solid #a04000; background:#fff; }
  .heart-pop { animation: heartPop .6s ease; display:inline-block; }
  @keyframes heartPop { 0%{transform:scale(0)} 60%{transform:scale(1.6)} 100%{transform:scale(1)} }
</style>
</head>

const screen = document.getElementById('screen');
let stars = 0, lives = 3, level = 1, found = 0, need = 6, wrongClicks = 0;

function updateHUD(){
  document.getElementById('stars').textContent = '⭐ ' + stars;
  document.getElementById('lives').textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
  document.getElementById('level-badge').textContent = 'Nivel ' + level;
}
function say(text, ok){
  const m = document.getElementById('msg');
  if(m){ m.innerHTML = text; m.className = 'msg ' + (ok ? 'ok' : 'no'); }
}
function addStar(n){ stars += n; updateHUD(); }
function confetti(){
  const emo = ['🎉','⭐','🐾','🌟','💛'];
  for(let i=0;i<14;i++){
    const c = document.createElement('div');
    c.className = 'confetti'; c.textContent = emo[i % emo.length];
    c.style.left = Math.random()*92 + '%';
    c.style.animationDuration = (0.9 + Math.random()*0.9) + 's';
    screen.appendChild(c);
    setTimeout(()=>c.remove(), 2000);
  }
}
function floatText(txt, x, y, color){
  const f = document.createElement('div');
  f.className = 'float-up'; f.textContent = txt;
  f.style.left = x+'px'; f.style.top = y+'px'; f.style.color = color; f.style.fontSize = '22px';
  screen.appendChild(f); setTimeout(()=>f.remove(), 1200);
}

/* ================= NIVEL 1: Conoce a la garrapata ================= */
const tickFacts = [
  {q:"¿Cómo es la garrapata café del perro?", opts:["Un insecto volador con alas 🦋","Un árbol pequeño 🌱","Un parásito de 8 patas, parecido a una arañita, que se pega a los perros"], a:2,
   f:"¡Exacto! Tiene 8 patas, no vuela ni salta: se sube a los perros y a las personas por contacto directo con la hierba o con otro animal."},
  {q:"¿Dónde vive la garrapata?", opts:["Con los perros, ¡y a veces dentro de las casas! 🏠","En el fondo del mar 🌊","En las nubes ☁️"], a:0,
   f:"¡Correcto! Vive pegada a los perritos y puede entrar a los hogares. Por eso hay que revisar a nuestras mascotas todos los días."},
  {q:"¿Cómo nos puede enfermar?", opts:["Ladrando muy fuerte 🔊","Picándonos y pasándonos una bacteria llamada Rickettsia 🦠","Mirándonos fijamente 👀"], a:1,
   f:"Así es: si una garrapata infectada nos pica, puede pasar la bacteria. ¡Por eso hay que quitárselas a tiempo a nuestras mascotas!"},
  {q:"¿Cómo prevenimos las garrapatas?", opts:["Dejando cacharros y hierba alta en el patio","Bañando y revisando a nuestras mascotas 🛁🐶","Nunca sacando al perro de paseo"], a:1,
   f:"¡Muy bien! Bañar y revisar a nuestras mascotas y mantener limpio el patio nos protege a todos, como recomienda CENAPRECE."}
];
let factIdx = 0;
function sceneMeetTick(){
  if(factIdx >= tickFacts.length){ level = 2; sceneBrush(); return; }
  const f = tickFacts[factIdx];
  screen.innerHTML = `
    <div class="scene-title">Misión 1: Conoce a la garrapata (${factIdx+1}/${tickFacts.length})</div>
    <div class="quiz-card">
      <img class="quiz-img wiggle" src="${TICK_IMG}" alt="Garrapata café del perro">
      <p class="story" style="margin:8px 0 0"><b>${f.q}</b></p>
    </div>
    <div class="option-row">
      ${f.opts.map((o,i)=>`<button class="big-btn" onclick="answerTick(${i})">${o}</button>`).join('')}
    </div>
    <div id="msg" class="msg"></div>
    <div class="fact-box" id="fact" style="display:none"></div>
    <div id="nextBtn" style="display:none"><button class="big-btn orange" onclick="nextTickFact()">Siguiente ➜</button></div>`;
  updateHUD();
}
function answerTick(i){
  const f = tickFacts[factIdx];
  if(i === f.a){
    say('¡Muy bien! +1 ⭐', true); addStar(1); confetti();
  } else {
    lives--; updateHUD();
    say('Ups… esa no es. Piensa otra vez. -1 ❤️', false);
    if(lives<=0){ gameOver(); return; }
    return;
  }
  document.getElementById('fact').style.display = 'block';
  document.getElementById('fact').textContent = '💡 ' + f.f;
  document.getElementById('nextBtn').style.display = 'block';
  screen.querySelectorAll('.option-row .big-btn').forEach(b=>b.disabled = true);
}
function nextTickFact(){ factIdx++; sceneMeetTick(); }

/* ================= NIVEL 2: Caza-garrapatas en el patio ================= */
function sceneBrush(){
  need = 8; found = 0;
  screen.innerHTML = `
    <div class="scene-title">Misión 2: ¡Caza-garrapatas en el patio!</div>
    <p class="story">Roco jugó en el patio y se le subieron <b>8 garrapatas</b>.
    Tócalas para quitarlas antes de que se escondan. ¡Pero cuidado! Si tocas a Roco o las plantas sin garrapata, Roco se asusta.</p>
    <div class="timer-bar"><div class="timer-fill" id="timer"></div></div>
    <div id="yard">
      <div class="sun">☀️</div>
      <div class="mood" id="mood">😊</div>
      <div class="bush" style="left:4%">🌿</div>
      <div class="bush" style="right:4%">🌵</div>
      <div class="dog" id="dog">🐕</div>
    </div>
    <div id="msg" class="msg"></div>`;
  updateHUD();
  const yard = document.getElementById('yard');
  const spots = [[10,20],[26,10],[46,22],[68,12],[86,30],[16,52],[60,48],[84,60],[36,58],[72,72]];
  const chosen = spots.sort(()=>Math.random()-.5).slice(0, need);
  chosen.forEach(([x,y]) => {
    const t = document.createElement('img');
    t.src = TICK_IMG; t.className = 'tick-img'; t.alt = 'garrapata';
    t.style.left = x+'%'; t.style.top = y+'%';
    t.style.transform = 'rotate(' + (Math.random()*40-20) + 'deg)';
    t.onclick = (e) => {
      t.remove(); found++;
      floatText('+1 ⭐', e.clientX - screen.getBoundingClientRect().left, e.clientY - screen.getBoundingClientRect().top, '#239b56');
      const dog = document.getElementById('dog');
      dog.classList.remove('happy-hop'); void dog.offsetWidth; dog.classList.add('happy-hop');
      if(found === need){
        addStar(3); confetti();
        document.getElementById('mood').textContent = '😄❤️';
        document.getElementById('mood').classList.add('heart-pop');
        say('¡Quedaste todas! Roco está feliz y libre de garrapatas. +3 ⭐', true);
        setTimeout(sceneCleanYard, 1200);
      } else {
        say('¡Qué buena puntería! Quedan ' + (need-found) + ' 🐾', true);
      }
    };
    yard.appendChild(t);
  });
  // Roco y las plantas: zonas trampa
  document.getElementById('dog').addEventListener('click', () => wrongTouch('dog'));
  // temporizador de escape
  let timeLeft = 100;
  const timer = document.getElementById('timer');
  const iv = setInterval(() => {
    timeLeft -= 1; timer.style.width = timeLeft + '%';
    if(timeLeft <= 0){
      clearInterval(iv);
      const ticks = yard.querySelectorAll('.tick-img');
      if(ticks.length > 0){
        ticks.forEach(t => { t.classList.add('flee'); });
        lives--; updateHUD();
        say('¡Se te escaparon ' + ticks.length + ' garrapatas! -1 ❤️', false);
        setTimeout(() => { if(lives<=0) gameOver(); else sceneBrush(); }, 1300);
      }
    }
    if(found === need) clearInterval(iv);
  }, 120);
}
function wrongTouch(id){
  const dog = document.getElementById('dog');
  dog.classList.remove('shake'); void dog.offsetWidth; dog.classList.add('shake');
  document.getElementById('mood').textContent = '😟';
  say('¡Ese es Roco! Toca solo las garrapatas 🕷️', false);
}

/* ================= NIVEL 3: Limpia el patio (prevención) ================= */
const cleanItems = [
  {e:"🪣", t:"cacharro con agua", bad:true},
  {e:"🛁", t:"bañera para Roco", bad:false},
  {e:"🗑️", t:"basura acumulada", bad:true},
  {e:"🧴", t:"shampoo antipulgas del veterinario", bad:false},
  {e:"🌿", t:"hierba muy alta y crecida", bad:true},
  {e:"🧹", t:"escoba para barrer el patio", bad:false},
  {e:"🍖", t:"comida tirada que atrae animales", bad:true},
  {e:"🐾", t:"rastrillo para el pasto corto", bad:false}
];
let cleanIdx = 0;
function sceneCleanYard(){
  if(cleanIdx >= cleanItems.length){ level = 4; sceneSymptoms(); return; }
  const it = cleanItems[cleanIdx];
  screen.innerHTML = `
    <div class="scene-title">Misión 3: Limpia el patio (${cleanIdx+1}/${cleanItems.length})</div>
    <p class="story">Ves esto en el patio de tu casa: <span class="pop" style="font-size:60px">${it.e}</span>
    <br><b>¿${it.t.charAt(0).toUpperCase()+it.t.slice(1)}… ayuda a traer garrapatas o nos protege?</b></p>
    <div class="option-row">
      <button class="big-btn red" onclick="answerClean(true)">😱 ¡Trae garrapatas, hay que quitarlo!</button>
      <button class="big-btn green" onclick="answerClean(false)">👍 ¡Eso nos protege, hay que conservarlo!</button>
    </div>
    <div id="msg" class="msg"></div>
    <div class="fact-box" id="fact" style="display:none"></div>
    <div id="nextBtn" style="display:none"><button class="big-btn orange" onclick="nextClean()">Siguiente ➜</button></div>`;
}
function answerClean(saidBad){
  const it = cleanItems[cleanIdx];
  if(saidBad === it.bad){
    say('¡Correcto! +1 ⭐', true); addStar(1); confetti();
  } else {
    lives--; updateHUD();
    say('Casi… -1 ❤️', false);
    if(lives<=0){ gameOver(); return; }
    return;
  }
  const fb = document.getElementById('fact');
  fb.style.display = 'block';
  fb.textContent = '💡 ' + (it.bad
    ? 'Los '+it.t+' atraen plagas y garrapatas. ¡Hay que eliminarlos! Mantener el patio limpio y el pasto corto evita que las garrapatas se acerquen (CENAPRECE).'
    : '¡Así es! '+it.t.charAt(0).toUpperCase()+it.t.slice(1)+' es parte del cuidado de nuestras mascotas y del hogar. La ectodesparasitación debe indicarla el veterinario.');
  document.getElementById('nextBtn').style.display = 'block';
  screen.querySelectorAll('.option-row .big-btn').forEach(b=>b.disabled = true);
}
function nextClean(){ cleanIdx++; sceneCleanYard(); }

/* ================= NIVEL 4: La decisión importante ================= */
function sceneSymptoms(){
  screen.innerHTML = `
    <div class="kid">🤒</div>
    <div class="scene-title">Misión 4: La decisión importante</div>
    <p class="story">Unos días después, tu hermanito tiene <b>fiebre</b> 🤒, <b>dolor de cabeza</b> 🤕, <b>dolor de cuerpo</b> y unas manchitas en la piel, y mamá recuerda que una garrapata lo picó la semana pasada.
    <br><b>¿Qué debe hacer tu familia?</b></p>
    <div class="option-row">
      <button class="big-btn green" onclick="rightChoice()">🏥 Ir de inmediato al centro de salud</button>
      <button class="big-btn red" onclick="wrongChoice(this,'No… automedicar puede ser peligroso. ¡Solo el médico indica el tratamiento!')">💊 Darle medicina de la cajita sin consultar</button>
      <button class="big-btn gray" onclick="wrongChoice(this,'No… esperar puede hacer que la enfermedad empeore mucho. ¡Ir pronto al doctor salva vidas!')">😴 Esperar a ver si se le quita solo</button>
    </div>
    <div id="msg" class="msg"></div>`;
  updateHUD();
}
function wrongChoice(btn, text){
  btn.disabled = true; btn.style.opacity = .45;
  lives--; updateHUD();
  say(text, false);
  if(lives<=0) gameOver();
}
function rightChoice(){
  addStar(3); confetti();
  say('¡Decisión perfecta! Ir pronto al centro de salud salva vidas. +3 ⭐', true);
  setTimeout(sceneEnd, 1800);
}

/* ================= Final ================= */
function sceneEnd(){
  const badge = stars >= 12 ? '🏆 Guardián de Oro' : stars >= 8 ? '🥇 Guardián de Plata' : '🥈 Guardián Explorador';
  screen.innerHTML = `
    <div class="kid">🏆🧒🐕</div>
    <div class="scene-title">¡Felicidades, ${badge}!</div>
    <div class="stars-end">${'⭐'.repeat(Math.min(10, Math.max(3, stars)))}</div>
    <p class="story">Aprendiste las 3 reglas de oro:<br>
    🐶 <b>Revisa y baña a tu mascota</b> · 🏠 <b>Mantén limpio tu patio</b> · 🏥 <b>Ante fiebre con picadura de garrapata, ve al centro de salud de inmediato</b></p>
    <div class="fact-box">💡 Dato para tu familia: el tratamiento de la rickettsiosis (un antibiótico llamado doxiciclina) lo indica <b>siempre un médico</b>. Acudir a consulta dentro de los primeros 5 días de síntomas evita que la enfermedad se vuelva grave. Nunca te automediques.</div>
    <button class="big-btn orange" onclick="restart()">Jugar otra vez 🔁</button>
    <div class="progress">Puntaje final: ${stars} estrellas</div>`;
}
function gameOver(){
  screen.innerHTML = `
    <div class="kid">🐾</div>
    <div class="scene-title">¡Roco necesita descansar!</div>
    <p class="story">Te quedaste sin corazones, pero aprender de los errores también es de científicos. ¡Inténtalo de nuevo!</p>
    <button class="big-btn green" onclick="restart()">Reintentar 💪</button>`;
}
function restart(){ stars=0; lives=3; level=1; factIdx=0; cleanIdx=0; found=0; updateHUD(); sceneMeetTick(); }

/* ---------- Inicio ---------- */
function sceneIntro(){
  screen.innerHTML = `
    <div class="kid"><span class="wiggle">🧒</span>🐕</div>
    <div class="scene-title">¡Hola, pequeño detective!</div>
    <p class="story">Este es <b>Roco</b>, tu perrito. A Roco le encanta jugar en el patio…
    ¡pero unas garrapatitas café muy traviesas, como esta, se suben a su pelaje!
    <img src="${TICK_IMG}" style="width:80px;vertical-align:middle;border-radius:10px;border:2px solid #a04000" alt="garrapata">
    <br>Ayuda a Roco en <b>4 misiones</b> y conviértete en <b>Guardián de las Garrapatas</b>.</p>
    <button class="big-btn green" onclick="sceneMeetTick()">¡Empezar la aventura! 🐾</button>`;
}
updateHUD(); sceneIntro();
</script>
</body>
</html>
